[project]
name = "neurobird"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Kele98-star", email = "kele.marcell.mail@gmail.com" }]
requires-python = ">=3.15"
dependencies = ["numpy>=2.5.4", "pygame-ce>=2.5.8"]

[project.scripts]
neurobird = "neurobird.main:main"
neurobird-train = "neurobird.train:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyrefly>=1.4.0", "pytest>=9.2.0", "ruff>=0.17.3"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY001", "D104", "D100", "D202", "D203", "D213", "D211", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ERA001", "D103", "S101"]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
